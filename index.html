<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPD MO Guide</title><meta name="theme-color" content="#0b5f66"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="secure/auth.css"></head><body><title>OPD MO Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b5f66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: pocket-handbook app. Sticky top bar, one reading column (max 46rem), bottom tab bar on phones. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --sunk: #e8eeef;
  --ink: #142429;
  --muted: #56686e;
  --line: #d3dddf;
  --accent: #0b5f66;
  --accent-soft: #dcecec;
  --flag: #b3261e;
  --flag-soft: #fbe9e7;
  --draft: #8a5300;
  --draft-soft: #fdf0d9;
  --mark: #ffe58a;
  --on-accent: #ffffff;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs: 16px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1517; --surface: #142024; --sunk: #1b2a2f; --ink: #e2ebec; --muted: #94a7ac; --line: #2a3b40;
    --accent: #5cc3c8; --accent-soft: #1b3a3d; --flag: #ff8a7a; --flag-soft: #3a1d1a;
    --draft: #f0b65a; --draft-soft: #3a2c14; --mark: #6b5a12; --on-accent: #0d1517; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1517; --surface: #142024; --sunk: #1b2a2f; --ink: #e2ebec; --muted: #94a7ac; --line: #2a3b40;
  --accent: #5cc3c8; --accent-soft: #1b3a3d; --flag: #ff8a7a; --flag-soft: #3a1d1a;
  --draft: #f0b65a; --draft-soft: #3a2c14; --mark: #6b5a12; --on-accent: #0d1517; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs); line-height: 1.55;
  margin: 0; min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--accent); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--accent); color: #fff;
}
.topbar-in {
  max-width: 46rem; margin: 0 auto; display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); min-height: 54px;
}
.topbar h1 { font-family: var(--f-head); font-weight: 600; font-size: 1.15rem; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
.topbar .sub { display: block; font-family: var(--f-body); font-weight: 400; font-size: .72rem; opacity: .8; letter-spacing: .04em; text-transform: uppercase; }
.icon-btn { background: none; border: 0; color: #fff; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 22px; height: 22px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .topbar, :root:not([data-theme="light"]) body::before { background: #12393d; } }
:root[data-theme="dark"] .topbar, :root[data-theme="dark"] body::before { background: #12393d; }

main { max-width: 46rem; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 16px 110px; }

/* Search field */
.searchbox { position: relative; }
.searchbox input {
  width: 100%; font: inherit; font-size: 1rem; padding: 12px 14px 12px 42px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.searchbox input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }

/* Library */
.eyebrow { font-family: var(--f-head); font-weight: 600; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.ch-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ch-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); text-decoration: none; color: inherit; }
.ch-row:hover { background: var(--sunk); }
.ch-code { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 0; width: 60px; text-align: center; flex: none; }
.ch-meta { flex: 1; min-width: 0; }
.ch-title { font-family: var(--f-head); font-weight: 600; font-size: 1.12rem; line-height: 1.25; }
.ch-sub { color: var(--muted); font-size: .82rem; }
.pill { display: inline-block; font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; vertical-align: 1px; }
.pill.draft { color: var(--draft); background: var(--draft-soft); }
.pill.approved { color: var(--accent); background: var(--accent-soft); }
.chev { color: var(--muted); flex: none; }
.coming { color: var(--muted); font-size: .9rem; margin-top: 10px; }

/* Chapter */
.ch-head { margin: 4px 0 12px; }
.ch-head h2 { font-family: var(--f-head); font-size: 1.8rem; line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
.draft-note { display: flex; gap: 10px; align-items: flex-start; background: var(--draft-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .88rem; margin: 10px 0 0; }
.draft-note b { color: var(--draft); }
.chips {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 10; background: var(--bg);
  display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin: 0; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .84rem; cursor: pointer; white-space: nowrap; }
.chip .n { font-family: var(--f-mono); color: var(--muted); margin-right: 4px; font-size: .75rem; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.on .n { color: inherit; opacity: .75; }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; scroll-margin-top: 120px; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec-n { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); width: 24px; flex: none; }
.sec-t { flex: 1; min-width: 0; font-family: var(--f-head); font-weight: 600; font-size: 1.08rem; line-height: 1.3; }
.sec .tw { transition: transform .15s; color: var(--muted); flex: none; }
.sec[open] .tw { transform: rotate(90deg); }
.star { background: none; border: 0; cursor: pointer; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.star.on { color: var(--draft); }
.star svg { width: 20px; height: 20px; }
.sec-body { padding: 0 16px 16px; min-width: 0; border-top: 1px solid var(--line); }
.sec-body > :first-child { margin-top: 14px; }

/* Prose */
.prose { overflow-wrap: anywhere; }
.prose p, .prose ul, .prose ol { margin: 0 0 .8em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: .25em 0; }
.prose h3 { font-family: var(--f-head); font-weight: 600; font-size: 1.05rem; margin: 1.4em 0 .5em; scroll-margin-top: 120px; color: var(--accent); text-wrap: balance; }
.prose h3.flag { color: var(--flag); }
.prose h3.flag + ul { background: var(--flag-soft); border-radius: 10px; padding: 10px 12px 10px 2em; }
.prose strong { font-weight: 600; }
.tbl { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--line); border-radius: 10px; -webkit-overflow-scrolling: touch; }
.prose table { border-collapse: collapse; font-size: .86rem; min-width: 100%; font-variant-numeric: tabular-nums; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 8.5em; overflow-wrap: normal; }
.prose th { background: var(--sunk); font-family: var(--f-head); font-weight: 600; font-size: .82rem; letter-spacing: .02em; position: sticky; top: 0; }
.prose tr:last-child td { border-bottom: 0; }
.prose td:first-child { font-weight: 500; }
.prose p.flag-p > strong:first-child { color: var(--flag); }
.prose p.flag-p + ul { background: var(--flag-soft); border-radius: 10px; padding: 10px 12px 10px 2em; }
.prose blockquote { margin: 0 0 1em; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sunk); border-radius: 0 10px 10px 0; }
.prose blockquote > :last-child { margin-bottom: 0; }
.prose ul.contains-task-list { list-style: none; padding-left: .2em; }
.prose td.rx { font-weight: 500; }
.prose td.rx-preferred { color: var(--accent); }
.prose td.rx-caution { color: var(--draft); }
.prose td.rx-hold { color: var(--draft); font-style: italic; }
.prose td.rx-avoid { color: var(--flag); }
.unv { background: var(--draft-soft); color: var(--draft); border-radius: 4px; padding: 0 4px; font-weight: 500; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.ev { display: inline-block; font-family: var(--f-mono); font-size: .68em; line-height: 1.5; color: var(--muted); background: var(--sunk); border-radius: 5px; padding: 0 5px; vertical-align: .12em; white-space: nowrap; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.src-link { font-size: .85rem; color: var(--muted); margin: 18px 0 0; }

/* Search results */
.results { display: grid; gap: 8px; margin-top: 14px; }
.res { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-decoration: none; color: inherit; }
.res:hover { border-color: var(--accent); }
.res-path { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.res-h { font-family: var(--f-head); font-weight: 600; font-size: 1rem; margin: 2px 0; }
.res-snip { font-size: .88rem; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.hint-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs-in { max-width: 46rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: grid; justify-items: center; gap: 2px; padding: 8px 0 10px; text-decoration: none; color: var(--muted); font-size: .74rem; font-weight: 500; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* Settings sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 18px 18px 0 0;
  padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  max-width: 46rem; margin: 0 auto;
}
.sheet h3 { font-family: var(--f-head); margin: 0 0 14px; font-size: 1.2rem; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 8px 14px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.about { font-size: .84rem; color: var(--muted); margin-top: 10px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="topbar">
  <div class="topbar-in">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="barTitle">OPD MO Guide<span class="sub">Adult medical OPD, Pakistan</span></h1>
    <button class="icon-btn" id="setBtn" aria-label="Reading settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main id="view"><p class="loading">Starting…</p></main>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <a class="tab" href="#" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-5A1.5 1.5 0 0 1 4 17V5.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h5A1.5 1.5 0 0 0 20 17V5.5z"/></svg>
      Chapters</a>
    <a class="tab" href="#search" data-tab="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      Search</a>
    <a class="tab" href="#saved" data-tab="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
      Saved</a>
  </div>
</nav>

<div id="sheetWrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-label="Reading settings">
    <h3>Reading settings</h3>
    <div class="set-row"><span>Text size</span>
      <div class="seg" id="fsSeg"><button data-fs="14">Small</button><button data-fs="16">Normal</button><button data-fs="18">Large</button><button data-fs="20">X-large</button></div></div>
    <div class="set-row"><span>Theme</span>
      <div class="seg" id="thSeg"><button data-th="system">System</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div></div>
    <p class="about" id="aboutText">Prototype build. Chapters are drafts under review and are not yet approved for clinical use.</p>
  </div>
</div>
